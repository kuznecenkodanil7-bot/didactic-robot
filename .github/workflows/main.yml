name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Show checked-out build.gradle
        run: |
          echo "Commit: $GITHUB_SHA"
          echo "===== build.gradle first 40 lines ====="
          sed -n '1,40p' build.gradle
          echo "===== Loom plugin lines ====="
          grep -n "fabric-loom" build.gradle || true

      - name: Verify Loom plugin
        run: |
          grep -q "net.fabricmc.fabric-loom-remap" build.gradle || {
            echo "ERROR: Wrong Loom plugin in build.gradle"
            echo "Expected: net.fabricmc.fabric-loom-remap"
            echo "Found:"
            grep -n "fabric-loom" build.gradle || true
            exit 1
          }

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Validate source bundle
        run: |
          if [ -f tools/verify_project.py ]; then
            python3 tools/verify_project.py
          else
            echo "tools/verify_project.py not found, skipping validation"
          fi

      - name: Build Fabric mod
        run: ./gradlew --no-daemon build

      - name: Upload mod jars
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: labychat-standalone-jars
          path: build/libs/*.jar
          
